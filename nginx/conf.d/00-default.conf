# HTTP fallback
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# HTTPS fallback
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/kwscloud.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kwscloud.in/privkey.pem;

    return 444;
}

---
# iptables: configure IP forwarding and NAT rules for KWS.
# Allows traffic to flow from WireGuard interface to LXD container bridge.

- name: Enable IP forwarding (runtime)
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Ensure IP forwarding persists across reboots
  lineinfile:
    path: /etc/sysctl.conf
    regexp: '^net\.ipv4\.ip_forward'
    line: 'net.ipv4.ip_forward = 1'
    state: present
  notify: reload sysctl

- name: Apply sysctl settings
  command: sysctl -p
  changed_when: false

- name: Install iptables-persistent for rule persistence
  apt:
    name:
      - iptables
      - iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Add NAT masquerade rule for LXD bridge (runtime)
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ lxd_bridge_subnet }}"
    out_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
    jump: MASQUERADE
    comment: "KWS LXD NAT masquerade"

- name: Add forward rule WireGuard -> LXD bridge (runtime)
  iptables:
    chain: FORWARD
    in_interface: "{{ wg_interface }}"
    out_interface: "{{ lxd_bridge_name }}"
    jump: ACCEPT
    comment: "KWS WG to LXD forward"

- name: Add forward rule LXD bridge -> WireGuard (runtime)
  iptables:
    chain: FORWARD
    in_interface: "{{ lxd_bridge_name }}"
    out_interface: "{{ wg_interface }}"
    jump: ACCEPT
    comment: "KWS LXD to WG forward"

- name: Allow forward from LXD bridge to internet (runtime)
  iptables:
    chain: FORWARD
    in_interface: "{{ lxd_bridge_name }}"
    out_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
    jump: ACCEPT
    comment: "KWS LXD to internet"

- name: Allow established/related connections (runtime)
  iptables:
    chain: FORWARD
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "KWS established/related"

- name: Allow established/related inbound connections
  iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "KWS established/related inbound"

- name: Allow HTTP on INPUT chain
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '80'
    jump: ACCEPT
    comment: "KWS HTTP"

- name: Allow HTTPS on INPUT chain
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '443'
    jump: ACCEPT
    comment: "KWS HTTPS"

- name: Allow WireGuard on INPUT chain
  iptables:
    chain: INPUT
    protocol: udp
    destination_port: "{{ wg_listen_port }}"
    jump: ACCEPT
    comment: "KWS WireGuard"

- name: Allow SSH on INPUT chain
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: '22'
    jump: ACCEPT
    comment: "KWS SSH"

- name: Allow loopback traffic
  iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    comment: "KWS loopback"

- name: Save iptables rules for persistence
  shell: netfilter-persistent save
  changed_when: false
